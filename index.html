
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Useless Button</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101014;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

.container {
    text-align: center;
    animation: appear 1s ease;
}

h1 {
    font-size: clamp(28px, 5vw, 46px);
    margin-bottom: 12px;
    letter-spacing: -1px;
}

p {
    color: #85858f;
    font-size: 15px;
    margin-bottom: 55px;
}

button {
    width: 260px;
    height: 260px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #ff3939, #c90000);
    color: white;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        0 15px 35px rgba(255, 0, 0, 0.25),
        inset 0 4px 8px rgba(255,255,255,0.2),
        inset 0 -8px 12px rgba(0,0,0,0.2);
    transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    transform: scale(1.07);
    filter: brightness(1.12);
    box-shadow:
        0 20px 55px rgba(255, 0, 0, 0.4),
        inset 0 4px 8px rgba(255,255,255,0.2);
}

button:active {
    transform: scale(0.94);
    box-shadow:
        0 5px 15px rgba(255, 0, 0, 0.2),
        inset 0 5px 12px rgba(0,0,0,0.3);
}

.footer {
    margin-top: 55px;
    font-size: 11px;
    color: #50505a;
    letter-spacing: 3px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 400px) {
    button {
        width: 220px;
        height: 220px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>The Useless Button</h1>
    <p>Go ahead. Click it. Nothing will happen.</p>

    <button type="button">
        CLICK ME
    </button>

    <div class="footer">
        100% USELESS · 100% FREE
    </div>
</div>

</body>
</html>
